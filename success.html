<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Message sent successfully to Finshiya K">

    <title>Message Sent | Finshiya K</title>


    <!-- =========================
         BOOTSTRAP
    ========================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =========================
         BOOTSTRAP ICONS
    ========================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- =========================
         GOOGLE FONTS
    ========================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">


    <!-- =========================
         SUCCESS PAGE CSS
    ========================== -->

    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================== */

        body {

            min-height: 100vh;

            font-family: "DM Sans", sans-serif;

            color: #f7f3e9;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(198, 161, 91, 0.14),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(18, 58, 44, 0.55),
                    transparent 45%
                ),

                #071b14;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        /* =========================
           MAIN WRAPPER
        ========================== */

        .success-wrapper {

            width: 100%;

            max-width: 650px;

            text-align: center;

        }


        /* =========================
           SUCCESS CARD
        ========================== */

        .success-card {

            position: relative;

            padding: 55px 45px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 58, 44, 0.94),
                    rgba(7, 27, 20, 0.97)
                );

            border: 1px solid rgba(198, 161, 91, 0.25);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.40),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            overflow: hidden;

        }


        /* =========================
           GOLD TOP LINE
        ========================== */

        .success-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 10%;

            width: 80%;

            height: 2px;

            background: #c6a15b;

            box-shadow:
                0 0 20px rgba(198, 161, 91, 0.55);

        }


        /* =========================
           SUCCESS ICON
        ========================== */

        .success-icon {

            width: 85px;

            height: 85px;

            margin: 0 auto 28px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1px solid rgba(198, 161, 91, 0.45);

            background: rgba(198, 161, 91, 0.10);

            color: #c6a15b;

            font-size: 38px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25),
                0 0 30px rgba(198, 161, 91, 0.08);

        }


        /* =========================
           LABEL
        ========================== */

        .success-label {

            color: #c6a15b;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 3px;

            margin-bottom: 14px;

            text-transform: uppercase;

        }


        /* =========================
           TITLE
        ========================== */

        .success-card h1 {

            font-family: "Playfair Display", serif;

            font-size: clamp(36px, 6vw, 55px);

            line-height: 1.1;

            margin-bottom: 18px;

            color: #f7f3e9;

        }


        /* =========================
           MESSAGE
        ========================== */

        .success-card p {

            max-width: 480px;

            margin: 0 auto 32px;

            color: rgba(247, 243, 233, 0.70);

            font-size: 16px;

            line-height: 1.8;

        }


        /* =========================
           BACK HOME BUTTON
        ========================== */

        .back-home-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 14px 25px;

            border-radius: 12px;

            border: 1px solid #c6a15b;

            background: #c6a15b;

            color: #071b14;

            text-decoration: none;

            font-size: 15px;

            font-weight: 700;

            transition: all 0.3s ease;

            cursor: pointer;

        }


        /* =========================
           BUTTON HOVER
        ========================== */

        .back-home-btn:hover {

            background: #f7f3e9;

            border-color: #f7f3e9;

            color: #071b14;

            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(198, 161, 91, 0.20);

        }


        /* =========================
           BUTTON ICON
        ========================== */

        .back-home-btn i {

            font-size: 18px;

            transition: transform 0.3s ease;

        }


        .back-home-btn:hover i {

            transform: translateX(-4px);

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            body {

                padding: 20px;

            }


            .success-card {

                padding: 45px 25px;

                border-radius: 22px;

            }


            .success-icon {

                width: 72px;

                height: 72px;

                font-size: 30px;

            }


            .success-label {

                font-size: 11px;

                letter-spacing: 2px;

            }


            .success-card p {

                font-size: 14px;

                line-height: 1.7;

            }


            .back-home-btn {

                width: 100%;

                padding: 14px 20px;

            }

        }


        /* =========================
           VERY SMALL DEVICES
        ========================== */

        @media (max-width: 380px) {

            .success-card {

                padding: 35px 18px;

            }


            .success-card h1 {

                font-size: 34px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         SUCCESS CONTENT
    ========================== -->

    <main class="success-wrapper">

        <div class="success-card">


            <!-- SUCCESS ICON -->

            <div class="success-icon">

                <i class="bi bi-check-lg"></i>

            </div>


            <!-- LABEL -->

            <div class="success-label">

                MESSAGE SENT

            </div>


            <!-- TITLE -->

            <h1>

                Thank You!

            </h1>


            <!-- MESSAGE -->

            <p>

                Your message has been sent successfully.
                Thank you for reaching out.
                I'll get back to you as soon as possible.

            </p>


            <!-- BACK TO HOME -->

            <a
                href="./index.html"
                class="back-home-btn">

                <i class="bi bi-arrow-left"></i>

                <span>
                    Back to Home
                </span>

            </a>


        </div>

    </main>


    <!-- =========================
         BOOTSTRAP JS
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
