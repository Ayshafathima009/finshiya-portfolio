<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Get in touch with Finshiya K">

    <title>Get In Touch | Finshiya K</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">


    <!-- =========================
         BOOTSTRAP
    ========================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =========================
         BOOTSTRAP ICONS
    ========================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- =========================
         GOOGLE FONTS
    ========================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">


    <!-- =========================
         MAIN CSS
    ========================== -->

    <link rel="stylesheet" href="./style.css">

</head>


<body>


    <!-- =========================
         CONTACT PAGE
    ========================== -->

    <main class="contact-page">

        <div class="contact-page-wrapper">


            <!-- =========================
                 BACK TO HOME
            ========================== -->

            <a href="./index.html" class="back-home">

                <i class="bi bi-arrow-left"></i>

                Back to Home

            </a>


            <!-- =========================
                 TITLE
            ========================== -->

            <div class="contact-page-title">

                <span class="section-label">
                    GET IN TOUCH
                </span>


                <h1>
                    Let's Connect.
                </h1>


                <p>
                    Have a project or job opportunity?
                    Feel free to send me a message.
                </p>

            </div>


            <!-- =========================
                 CONTACT FORM
            ========================== -->

            <div class="contact-form-wrapper">


                <form id="contactForm">


                    <!-- =========================
                         WEB3FORMS ACCESS KEY
                    ========================== -->

                    <input
                        type="hidden"
                        name="access_key"
                        value="e9db4c7f-f213-4b3b-b4f9-7039c441da73">


                    <!-- =========================
                         EMAIL SUBJECT
                    ========================== -->

                    <input
                        type="hidden"
                        name="subject"
                        value="New Portfolio Contact Message">


                    <!-- =========================
                         SENDER NAME
                    ========================== -->

                    <input
                        type="hidden"
                        name="from_name"
                        value="Finshiya Portfolio">


                    <!-- =========================
                         NAME
                    ========================== -->

                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your Name"
                            autocomplete="name"
                            required>

                    </div>


                    <!-- =========================
                         EMAIL
                    ========================== -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Your Email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- =========================
                         SUBJECT
                    ========================== -->

                    <div class="form-group">

                        <label for="message_subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="message_subject"
                            name="message_subject"
                            placeholder="Subject"
                            required>

                    </div>


                    <!-- =========================
                         MESSAGE
                    ========================== -->

                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Write your message..."
                            required></textarea>

                    </div>


                    <!-- =========================
                         SEND BUTTON
                    ========================== -->

                    <button
                        type="submit"
                        id="sendMessageBtn"
                        class="send-message-btn">

                        <i class="bi bi-send"></i>

                        <span>
                            Send Message
                        </span>

                    </button>


                    <!-- =========================
                         STATUS MESSAGE
                    ========================== -->

                    <div
                        id="formStatus"
                        style="
                            margin-top: 15px;
                            text-align: center;
                            display: none;
                        ">
                    </div>


                </form>


            </div>

        </div>

    </main>


    <!-- =========================
         BOOTSTRAP JS
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =========================
         CONTACT FORM SCRIPT
    ========================== -->

    <script>

        const contactForm =
            document.getElementById("contactForm");

        const sendMessageBtn =
            document.getElementById("sendMessageBtn");

        const formStatus =
            document.getElementById("formStatus");


        contactForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            /* =========================
               BUTTON LOADING
            ========================== */

            sendMessageBtn.disabled = true;

            sendMessageBtn.innerHTML = `
                <span class="spinner-border spinner-border-sm"></span>
                <span>Sending...</span>
            `;


            formStatus.style.display = "none";


            /* =========================
               FORM DATA
            ========================== */

            const formData =
                new FormData(contactForm);


            try {

                /* =========================
                   SEND TO WEB3FORMS
                ========================== */

                const response = await fetch(
                    "https://api.web3forms.com/submit",
                    {
                        method: "POST",
                        body: formData
                    }
                );


                const result =
                    await response.json();


                /* =========================
                   SUCCESS
                ========================== */

                if (result.success) {

                    /*
                     * Important:
                     * We are NOT using Web3Forms
                     * redirect here.
                     *
                     * We manually redirect to
                     * success.html.
                     */

                    window.location.href =
                        "./success.html";

                    return;
                }


                /* =========================
                   WEB3FORMS ERROR
                ========================== */

                formStatus.style.display = "block";

                formStatus.style.color = "#ff6b6b";

                formStatus.textContent =
                    result.message ||
                    "Something went wrong. Please try again.";


            } catch (error) {

                console.error(
                    "Form submission error:",
                    error
                );


                formStatus.style.display = "block";

                formStatus.style.color = "#ff6b6b";

                formStatus.textContent =
                    "Unable to send your message. Please check your internet connection and try again.";

            }


            /* =========================
               RESTORE BUTTON
            ========================== */

            sendMessageBtn.disabled = false;

            sendMessageBtn.innerHTML = `
                <i class="bi bi-send"></i>
                <span>Send Message</span>
            `;

        });

    </script>


</body>

</html>
